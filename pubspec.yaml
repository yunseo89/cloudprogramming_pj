name: movielog_diary
description: 서버 없이 기기에 남기는 나의 영화 감상 기록
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  dio: ^5.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
